[project]
name = "mcu-mcp-server"
version = "0.1.0"
description = "MCP server for Mackie Control Universal protocol"
requires-python = ">=3.10"
readme = "README.md"
authors = [
  { name="mackatwentytsuru", email="mackatwentytsuru@users.noreply.github.com" },
]
urls = { Repository = "https://github.com/mackatwentytsuru/qlcplus" }
dependencies = [
    "mcp[cli]>=1.0.0",
    "python-rtmidi>=1.5.0",
]

[project.scripts]
mcu-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "mcu_protocol"]
